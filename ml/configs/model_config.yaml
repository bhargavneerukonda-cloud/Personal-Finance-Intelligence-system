# FinSight AI Model Configuration
# All ML model hyperparameters and pipeline settings centralized here.

categorizer:
  model_type: xgboost
  params:
    n_estimators: 500
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 3
    gamma: 0.1
    reg_alpha: 0.1
    reg_lambda: 1.0
    random_state: 42
    n_jobs: -1
  calibration:
    method: isotonic
    cv: prefit
  evaluation:
    primary_metric: f1_weighted
    min_improvement_for_promotion: 0.01
    validation_split: 0.15
  serving:
    max_batch_size: 500
    target_latency_ms: 100

forecaster:
  model_type: prophet
  params:
    seasonality_mode: multiplicative
    changepoint_prior_scale: 0.05
    weekly_seasonality: true
    yearly_seasonality: true
    daily_seasonality: false
  horizons: [7, 14, 30, 60, 90]
  evaluation:
    primary_metric: mape
    target_mape: 10.0
    holdout_days: 30

anomaly_detector:
  model_type: isolation_forest
  params:
    contamination: 0.02
    n_estimators: 200
    random_state: 42
    n_jobs: -1
  z_score_threshold: 3.0
  evaluation:
    primary_metric: f1
    operating_point: 0.5  # anomaly_score threshold for binary flag

health_scorer:
  weights:
    savings_rate: 0.30
    budget_adherence: 0.25
    spending_stability: 0.20
    emergency_fund: 0.15
    debt_ratio: 0.10
  thresholds:
    emergency_fund_months_target: 3
    savings_rate_target: 0.20
    max_dti_ratio: 0.36

mlops:
  mlflow_experiment: finsight-models
  model_registry_stage: Staging  # → Production after shadow test
  shadow_deploy_hours: 48
  drift_check_schedule: "0 2 * * 0"  # Weekly Sunday 2am
  psi_threshold: 0.2
  retrain_trigger: drift_detected_or_weekly
