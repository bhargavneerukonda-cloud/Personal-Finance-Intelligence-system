global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: finsight-ai
    environment: development

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  # FastAPI backend metrics
  - job_name: "finsight-backend"
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics
    scrape_interval: 10s

  # ML serving metrics
  - job_name: "finsight-ml"
    static_configs:
      - targets: ["ml_server:8001"]
    metrics_path: /metrics
    scrape_interval: 30s

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Redis metrics (if redis-exporter is running)
  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]
    scrape_interval: 30s

  # PostgreSQL metrics (if postgres-exporter is running)
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres:5432"]
    scrape_interval: 30s
